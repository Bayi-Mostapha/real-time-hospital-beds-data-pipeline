apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse-uid
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http        
      username: user
      defaultDatabase: hospital
    secureJsonData:
      password: password
    isDefault: true

  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: "500ms" 